<div
  class="texto-gpt-container"
  aria-label="Artículo de asesoría TextoGPT"
  role="article"
  *ngIf="articulo">

  <!-- ── VIEWPORT: panel de texto ──────── -->
  <div class="texto-gpt-viewport">
    <div class="texto-gpt-texto-panel">

      <!-- Durante la animación typewriter (HTML renderizado progresivamente) -->
      <div *ngIf="isTyping" class="html-content typewriter-active">
        <span [innerHTML]="typewriterHtml"></span><span class="typewriter-cursor">▋</span>
      </div>

      <!-- HTML completo al terminar -->
      <div
        *ngIf="!isTyping"
        class="html-content"
        [innerHTML]="textoHtml">
      </div>

    </div>
  </div>

  <!-- ── FOOTER: botón TTS ─────── -->
  <div class="texto-gpt-footer">
    <button
      class="tts-btn"
      (click)="toggleTTS()"
      [class.speaking]="isSpeaking"
      [attr.aria-label]="isSpeaking ? 'Detener lectura' : 'Leer en voz alta'"
      [title]="isSpeaking ? 'Detener lectura' : 'Leer en voz alta'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        <path *ngIf="isSpeaking"  d="M18.5 12c0-2.98-1.68-5.57-4.15-6.89l-.85 1.55C15.5 7.57 16.5 9.68 16.5 12s-1 4.43-3 5.34l.85 1.55C16.82 17.57 18.5 14.98 18.5 12z"/>
        <path *ngIf="!isSpeaking" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06C15.48 15.3 16.5 13.77 16.5 12z"/>
      </svg>
    </button>
  </div>

  <!-- ── BARRA DE INTERACCIÓN SOCIAL ──────────────────────────────────── -->
  <div class="texto-gpt-interaction-bar">

    <!-- Me gusta -->
    <button
      class="interact-btn"
      [class.liked]="isLiked"
      (click)="toggleLike()"
      aria-label="Me gusta"
      title="Me gusta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>

    <!-- Comentar -->
    <button
      class="interact-btn"
      [class.active]="isCommented"
      (click)="toggleComment()"
      aria-label="Comentar"
      title="Comentar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <!-- Repostear -->
    <button
      class="interact-btn"
      [class.active]="isReposted"
      (click)="toggleRepost()"
      aria-label="Repostear"
      title="Repostear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="17 1 21 5 17 9"/>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </button>

    <!-- Compartir -->
    <button
      class="interact-btn"
      [class.active]="isShared"
      (click)="toggleShare()"
      aria-label="Compartir"
      title="Compartir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>

    <!-- Favoritos -->
    <button
      class="interact-btn"
      [class.favorited]="isFavorited"
      (click)="toggleFavorite()"
      aria-label="Guardar en favoritos"
      title="Favoritos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>

  </div>

</div>
