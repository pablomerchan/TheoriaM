[sql_server]
driver = ODBC Driver 18 for SQL Server
server = LAPTOP-FPME\SQLEXPRESS
users_database = TheoriaM
session_logs_database = TheorIAM
username = usuario_web
; Generar el valor desde Backend con: python -m services.database_secret
password_encrypted = DPAPI:
password_environment_variable = THEORIAM_DB_PASSWORD
encrypt = no
trust_server_certificate = no
pooling = no
multiple_active_result_sets = no
application_name = TheoriaM
connection_timeout_seconds = 15
command_timeout_seconds = 0
account_status = activo
